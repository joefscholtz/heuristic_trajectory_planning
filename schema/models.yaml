$defs:
  BaseModel:
    type: object
    # The discriminator tells the parser to look at the 'type' field to resolve the polymorphism
    discriminator:
      propertyName: type
    oneOf:
      - $ref: "#/$defs/ModelLinear"
      - $ref: "#/$defs/ModelNonLinear"

  ModelLinear:
    type: object
    properties:
      type:
        type: string
        const: model_linear
      slope:
        type: number
    required: [type, slope]

  ModelNonLinear:
    type: object
    properties:
      type:
        type: string
        const: model_non_linear
      polynomial_degree:
        type: integer
    required: [type, polynomial_degree]
