[project]
name = "heuristic-trajectory-planning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joe Ferreira Scholtz", email = "joefscholtz@gmail.com" },
    { name = "Matheus Schein", email = "mateusrobots@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio-tools>=1.84.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "protobuf>=7.36.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
heuristic-trajectory-planning = "heuristic_trajectory_planning:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
